[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "absi"
version = "0.1.0"
description = "Espectroscopia inversa de horizontes acusticos: identificabilidad del perfil de flujo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Valentino Alvarado", email = "valentino.alvarado.r@uni.pe"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13.0"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]